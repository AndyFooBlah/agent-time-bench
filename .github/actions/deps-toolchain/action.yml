# Repo-specific toolchain for deps-fixer.yml (dependency program,
# AndyFooBlah/andy-private-docs#57). Mirrors the setup steps in ci.yml,
# which uses this action too: Node 24 for bridge/, uv for harness/
# (Python from harness/.python-version).
name: deps-toolchain
description: Install the toolchain CI uses
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: bridge/package-lock.json
    - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        working-directory: harness
